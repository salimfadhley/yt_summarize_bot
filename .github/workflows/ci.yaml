name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Poetry installation
      uses: actions/cache@v4
      with:
        path: ~/.local
        key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.5
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      run: poetry install --with dev

    - name: Check code formatting with Black
      run: poetry run black --check --diff src/

    - name: Run Ruff linting
      run: poetry run ruff check src/

    - name: Run MyPy type checking
      run: poetry run mypy src/

    - name: Run tests
      run: poetry run pytest src/test_yt_summarize_bot/ -v --tb=short -m "not integration"

  docker-build:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: yt-summarize-bot:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker build for dev
      uses: docker/build-push-action@v5
      with:
        context: .
        target: yt_summarize_bot_dev
        push: false
        tags: yt-summarize-bot-dev:test
        cache-from: type=gha
        cache-to: type=gha,mode=max