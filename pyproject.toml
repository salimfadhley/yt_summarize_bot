[tool.poetry]
name = "yt-summarize-bot"
version = "0.1.0"
description = "A Telegram bot that summarizes YouTube videos using AI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "yt_summarize_bot"}]

[tool.poetry.scripts]
yt-summarize-bot = "yt_summarize_bot.main:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
aiogram = "^3.15.0"
speechrecognition = "^3.11.0"
pytube = "^15.0.0"
pydub = "^0.25.1"
youtube-transcript-api = "^0.6.3"
redis = "^5.2.1"
python-dotenv = "^1.0.1"
aiohttp = "^3.11.11"
yt-dlp = "^2024.12.23"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.8.5"
mypy = "^1.14.0"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
pre-commit = "^4.0.1"
types-requests = "^2.32.4.20250809"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "C90"]
ignore = ["E501"]  # Ignore line too long, let black handle it

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
